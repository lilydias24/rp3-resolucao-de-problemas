[project]
name = "problema-4"
version = "0.1.0"
description = "Sistema de gerenciamento de histórias de usuário com LLMs"
authors = [
    {name = "moraeseriic", email = "moraeseriic@gmail.com"},
    {name = "emillydias", email = "emillydias2408@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9,<4.0"

dependencies = [
    "black>=25.1.0,<26.0.0",
    "groq>=0.28.0,<0.29.0",
    "instructor>=1.9.0,<2.0.0",
    "fastapi>=0.108.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "aspectlib>=1.5.0,<2.0.0",
    "httpx>=0.26.0,<1.0.0",  # Vírgula adicionada aqui
    # banco de dados
    "psycopg2-binary>=2.9.0,<3.0.0",  # Para PostgreSQL
    "alembic>=1.13.0,<2.0.0",  # Para migrações    
    # Autenticação e segurança
    "passlib>=1.7.0,<2.0.0",  # Para hash de senhas
    "pydantic-settings (>=2.10.0,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.26.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "ipdb>=0.13.0,<1.0.0",  # Para debugging
    "ruff>=0.2.0,<1.0.0"  # Linter
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"