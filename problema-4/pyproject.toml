[project]
name = "problema-4"
version = "0.1.0"
description = "Sistema de gerenciamento de histórias de usuário com LLMs"
authors = [
    {name = "moraeseriic", email = "moraeseriic@gmail.com"},
    {name = "emillydias", email = "emillydias2408@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9,<4.0"

dependencies = [
    "black>=25.1.0,<26.0.0",
    "groq>=0.28.0,<0.29.0",
    "instructor>=1.9.0,<2.0.0",
    "fastapi>=0.108.0,<1.0.0",
    "uvicorn>=0.27.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "aspectlib>=1.5.0,<2.0.0",
    "httpx>=0.26.0,<1.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "passlib>=1.7.0,<2.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "python-jose>=3.3.0,<4.0.0",
    "pydantic[email]>=2.5.0,<3.0.0",
    "python-multipart>=0.0.5,<1.0.0",
    "bcrypt (>=4.3.0,<5.0.0)",
    "email-validator (>=2.2.0,<3.0.0)"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.26.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "ipdb>=0.13.0,<1.0.0",
    "ruff>=0.2.0,<1.0.0",
    "pytest-cov>=5.0.0"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
httpx = "^0.27.0"
pytest-cov = "^5.0.0"
pytest-html = "^4.1.1"
pytest-csv = "^3.0.0"
uvicorn = "^0.35.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"