[project]
name = "sistema-recomendacao-carreiras"
version = "0.1.0"
description = "Sistema de recomendação de carreiras usando paradigma lógico"
authors = [
    {name = "Emilly Dias", email = "emillydias.aluno@unipampa.edu.br"},
    {name = "Eric Moraes", email = "ericmoraes.aluno@unipampa.edu.br"},
    {name = "Matheus Cabral", email = "matheuscabral.aluno@unipampa.edu.br"},
    {name = "Douglas Siqueira", email = "douglasisrael.aluno@unipampa.edu.br"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "sqlite3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
